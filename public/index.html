<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MentorTrack — Supercharge your mentorship with automated tracking." />
  <meta name="theme-color" content="#000000" />
  <title>MentorTrack — The Ultimate Mentorship Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Landing Page Vercel-style Overrides */
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    
    /* Navbar */
    .vercel-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 4%;
      position: absolute;
      top: 0;
      width: 100%;
      z-index: 100;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .logo-triangle {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 18px solid #fff;
    }
    .nav-links {
      display: flex;
      gap: 1.5rem;
    }
    .nav-links a {
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: #fff;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .btn-outline {
      background: #000;
      color: #fff;
      border: 1px solid #333;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-outline:hover {
      background: #111;
      border-color: #666;
    }
    .btn-solid {
      background: #fff;
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-solid:hover {
      background: #e6e6e6;
    }

    /* Hero Section */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      overflow: hidden;
    }
    
    .hero-bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .hero-center-triangle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 260px solid #000;
      filter: drop-shadow(0 0 40px rgba(255,255,255,0.4));
      z-index: 1;
    }
    /* Inner black triangle to create the stroke effect if needed, but solid black over white glow is exactly Vercel's look */

    .hero-content-left {
      position: relative;
      z-index: 2;
      max-width: 500px;
    }
    .hero-title {
      font-size: 5rem;
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 2rem;
    }
    .hero-buttons {
      display: flex;
      gap: 1rem;
    }

    .hero-content-right {
      position: relative;
      z-index: 2;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 2;
      color: #fff;
      letter-spacing: 0.05em;
      text-align: left;
    }
    .hero-content-right p {
      margin: 0;
    }

    /* Footer Logos */
    .footer-logos {
      position: absolute;
      bottom: 2rem;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4rem;
      z-index: 2;
      opacity: 0.6;
    }
    .footer-logos span {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="vercel-nav animate-in">
    <div class="nav-left">
      <a href="/" class="logo-triangle"></a>
      <div class="nav-links">
        <a href="#features">Products</a>
        <a href="#resources">Resources</a>
        <a href="#enterprise">Enterprise</a>
        <a href="#pricing">Pricing</a>
      </div>
    </div>
    <div class="nav-right">
      <a href="login.html" class="btn-outline">Log In</a>
      <a href="login.html" class="btn-solid">Sign Up</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="hero">
    <div class="hero-bg-glow"></div>
    <div class="hero-center-triangle animate-in" style="animation-duration: 2s;"></div>

    <div class="hero-content-left animate-in">
      <h1 class="hero-title">Mentorship<br>Infrastructure</h1>
      <div class="hero-buttons">
        <a href="login.html" class="btn-solid" style="padding: 0.8rem 1.5rem; font-size: 1rem;">Deploy Now</a>
        <a href="#contact" class="btn-outline" style="padding: 0.8rem 1.5rem; font-size: 1rem;">Talk to Sales</a>
      </div>
    </div>

    <div class="hero-content-right animate-in" style="animation-delay: 0.2s; opacity: 0;">
      <p>FOR MENTORSHIP AGENTS</p>
      <p>TO TRACK LEETCODE AND GITHUB</p>
      <p>AUTOMATED BY MENTORTRACK</p>
    </div>

    <div class="footer-logos animate-in" style="animation-delay: 0.4s; opacity: 0;">
      <span>Vercel</span>
      <span>GitHub</span>
      <span>LeetCode</span>
      <span>Supabase</span>
    </div>
  </main>

</body>
</html>
